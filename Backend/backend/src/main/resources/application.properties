# All values come from environment variables; the defaults below are for local development only.
# Production values are injected by deploy/docker-compose.prod.yml (generated by Terraform).

spring.application.name=credisense
server.port=${PORT:8081}

# ─── PostgreSQL ───────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/creditsense}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# ─── Uploads ──────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
upload.base-path=${UPLOAD_BASE_PATH:./uploads}

# ─── JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ─── Python AI microservice ───────────────────────────────────────
nlp.service.url=${AI_SERVICE_URL:http://localhost:8002}
python.ai.url=${AI_SERVICE_URL:http://localhost:8002}
doctr.service.url=${AI_SERVICE_URL:http://localhost:8002}

# ─── Groq ─────────────────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ─── Google OAuth ─────────────────────────────────────────────────
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ─── App / CORS ───────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ─── SMTP ─────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
