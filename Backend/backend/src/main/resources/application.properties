# Committed file: NO secrets here. Every value comes from an environment variable.
# - Production: variables are injected by deploy/docker-compose.prod.yml (written by Terraform).
# - Local dev: put your real values in Backend/backend/application-local.properties (git-ignored),
#   it is loaded automatically and overrides everything below.
spring.config.import=optional:file:./application-local.properties

spring.application.name=demo
server.port=${PORT:8081}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ─── PostgreSQL ───────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/creditsense}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ─── JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration=${JWT_EXPIRATION_MS:1800000}

# ─── Uploads / PDF conversion ─────────────────────────────────────
upload.base-path=${UPLOAD_BASE_PATH:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ─── Google OAuth ─────────────────────────────────────────────────
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

# ─── Python AI microservice ───────────────────────────────────────
doctr.service.url=${AI_SERVICE_URL:http://localhost:8002}
nlp.service.url=${AI_SERVICE_URL:http://localhost:8002}
python.ai.url=${AI_SERVICE_URL:http://localhost:8002}

# ─── Groq ─────────────────────────────────────────────────────────
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.key=${GROQ_API_KEY:}

# ─── Mail (Gmail) ─────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
