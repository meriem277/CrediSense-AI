<!-- dossier-modal.html -->
<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-box" role="dialog" aria-modal="true">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div>
        <h2 class="modal-title">Nouveau Dossier</h2>
        <p class="modal-subtitle">Créer un dossier de crédit</p>
      </div>
      <button class="modal-close-btn" (click)="onClose()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Erreur -->
      <div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <!-- Type de crédit -->
      <div class="form-group">
        <label class="form-label">Type de crédit <span class="required">*</span></label>
        <div class="type-selector">
          <button
            class="type-btn"
            [class.active]="form.typeCredit === 'IMMOBILIER'"
            (click)="form.typeCredit = 'IMMOBILIER'"
          >
            <span class="type-icon">🏠</span>
            <span class="type-label">Immobilier</span>
          </button>
          <button
            class="type-btn"
            [class.active]="form.typeCredit === 'CONSOMMATION'"
            (click)="form.typeCredit = 'CONSOMMATION'"
          >
            <span class="type-icon">💳</span>
            <span class="type-label">Consommation</span>
          </button>
        </div>
      </div>

      <!-- Statut -->
      <div class="form-group">
        <label class="form-label">Statut <span class="required">*</span></label>
        <div class="statut-selector">
          <button
            class="statut-btn pending"
            [class.active]="form.statut === 'EN_COURS'"
            (click)="form.statut = 'EN_COURS'"
          >
            En cours
          </button>
          <button
            class="statut-btn approved"
            [class.active]="form.statut === 'APPROUVE'"
            (click)="form.statut = 'APPROUVE'"
          >
            Approuvé
          </button>
          <button
            class="statut-btn refused"
            [class.active]="form.statut === 'REFUSE'"
            (click)="form.statut = 'REFUSE'"
          >
            Refusé
          </button>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-cancel" (click)="onClose()" [disabled]="isLoading">
        Annuler
      </button>
      <button
        class="btn btn-submit"
        (click)="onSubmit()"
        [disabled]="!isFormValid || isLoading"
      >
        <span class="btn-spinner" *ngIf="isLoading"></span>
        <svg *ngIf="!isLoading" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        {{ isLoading ? 'Création...' : 'Créer le dossier' }}
      </button>
    </div>

  </div>
</div>
