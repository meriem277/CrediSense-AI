<div class="page">
  <div class="card">
    <h1>Inscription</h1>
    <p class="sub">Créez votre compte pour commencer</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Nom complet</label>
        <input type="text" formControlName="nom" placeholder="Jean Dupont" />
        <span class="err" *ngIf="form.get('nom')?.invalid && form.get('nom')?.touched">Champ requis</span>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="vous@exemple.com" />
        <span class="err" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Email invalide</span>
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" placeholder="6 caractères min." />
        <span class="err" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">6 caractères minimum</span>
      </div>

      <div class="field">
        <label>Rôle</label>
        <select formControlName="role">
          <option value="AGENT">Agent</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <span class="err global" *ngIf="error">{{ error }}</span>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Inscription…' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="switch">
      Déjà un compte ?
      <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
