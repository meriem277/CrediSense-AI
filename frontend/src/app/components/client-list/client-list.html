<div class="clients-list">

  <!-- En-tête -->
  <div class="list-header">
    <p class="list-title">Liste des clients</p>
    <span class="list-count" *ngIf="!loading && clients.length > 0">
      {{ clients.length }}
    </span>
  </div>

  <!-- Chargement -->
  <div class="list-loading" *ngIf="loading">
    <span class="spinner"></span>
    <span>Chargement...</span>
  </div>

  <!-- Erreur -->
  <div class="list-error" *ngIf="error && !loading">
    {{ error }}
  </div>

  <!-- Vide -->
  <div class="list-empty" *ngIf="!loading && !error && clients.length === 0">
    Aucun client trouvé.
  </div>

  <!-- Liste -->
  <ul class="list" *ngIf="!loading && !error && clients.length > 0">
    <li
      class="list-item"
      [class.active]="selectedClientId === client.id"
      *ngFor="let client of clients"
      (click)="selectClient(client)"
    >
      <div class="client-initials">{{ getInitiales(client) }}</div>

      <div class="client-info">
        <span class="client-name">{{ client.prenom }} {{ client.nom }}</span>
        <span class="client-cin">{{ client.cin }}</span>
      </div>

      <svg class="client-chevron" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </li>
  </ul>

  <!-- Footer -->
  <div class="list-footer">
    <button class="btn-create-client" (click)="onCreateClicked()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nouveau client
    </button>
  </div>

</div>
