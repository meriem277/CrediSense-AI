<div class="hero">

  <div class="hero-top">
    <div class="hero-left">
      <div class="hero-brand">
        <img src="/images/logo-attijaribank.png" alt="Attijari Bank" class="brand-logo" />
        <div class="brand-divider"></div>
        <span class="brand-label">Espace agent</span>
      </div>
      <div class="hero-greeting-text">
        <span class="greeting-label">{{ greeting }},</span>
        <span class="agent-name">{{ agentPrenom }} {{ agentNom }}</span>
      </div>
      <div class="hero-date">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
        </svg>
        {{ today | date:'EEEE d MMMM yyyy' : '' : 'fr' }}
      </div>
    </div>


  </div>

  <div class="kpi-grid">

    <!-- Dossiers traités -->
    <div class="kpi-card kpi-graphite">
      <div class="kpi-header">
        <div class="kpi-icon kpi-icon-orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
      </div>
      <div class="kpi-value">{{ dossiersTraites }}</div>
      <div class="kpi-label">Dossiers traités</div>
      <svg class="kpi-sparkline" viewBox="0 0 120 36" preserveAspectRatio="none">
        <polyline
          points="0,28 15,24 30,26 45,18 60,20 75,12 90,14 105,6 120,8"
          fill="none" stroke="#f47920" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      </svg>
    </div>

    <!-- Approuvés -->
    <div class="kpi-card kpi-graphite">
      <div class="kpi-header">
        <div class="kpi-icon kpi-icon-orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span class="kpi-badge">{{ dossiersApprouves }} dossiers</span>
      </div>
      <div class="kpi-value">{{ tauxApprobation }}<span class="kpi-unit">%</span></div>
      <div class="kpi-label">Approuvés</div>
      <div class="kpi-donut-wrap">
        <svg viewBox="0 0 80 80" width="64" height="64">
          <circle cx="40" cy="40" r="32" fill="none"
                  stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
          <circle #donutCircle cx="40" cy="40" r="32" fill="none"
                  stroke="#f47920" stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="201"
                  stroke-dashoffset="201"
                  transform="rotate(-90 40 40)"
                  style="transition: stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)"/>
        </svg>
      </div>
    </div>

    <!-- Dossiers refusés -->
    <div class="kpi-card kpi-graphite">
      <div class="kpi-header">
        <div class="kpi-icon kpi-icon-red">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
      </div>
      <div class="kpi-value">{{ dossiersRefuses }}</div>
      <div class="kpi-label">Dossiers refusés</div>
      <div class="kpi-bar-wrap">
        <div class="kpi-bar-track">
          <div #barFill class="kpi-bar-fill" style="width:0%"></div>
        </div>
        <span class="kpi-bar-label">{{ pourcentageRefuses }}% du total</span>
      </div>
    </div>

  </div>
</div>
