name: Deploy Backend (Spring Boot)

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}   # permet de relancer manuellement depuis l'onglet Actions

env:
  AZURE_WEBAPP_NAME: credisense-backend   # doit correspondre à azure-setup.sh
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build avec Maven
        working-directory: ./Backend
        run: mvn clean package -DskipTests

      - name: Localiser le jar généré
        id: jar
        working-directory: ./Backend
        run: echo "path=$(ls target/*.jar | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Déployer sur Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: ${{ steps.jar.outputs.path }}
